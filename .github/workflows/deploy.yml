name: Main Branch Pipeline - Build, Push and Deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: node scenario-b/test/app.test.js

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./scenario-b/swarm-app
          push: false
